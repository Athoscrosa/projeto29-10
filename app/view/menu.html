<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{EMPRESA}} - Sistema Comercial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Fundo principal */
    body {
      background: url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1600&q=80') 
                  center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar elegante */
    .navbar {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
    }

    .navbar-brand {
      color: #fff !important;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .nav-link {
      color: #f0f0f0 !important;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #ffd700 !important;
    }

    /* Área de conteúdo principal */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .btn-custom {
      margin-top: 25px;
      padding: 10px 25px;
      font-size: 1.1rem;
      background-color: #ffd700;
      border: none;
      color: #000;
      font-weight: 600;
      transition: all 0.3s ease;
      border-radius: 4px;
    }

    .btn-custom:hover {
      background-color: #fff;
      color: #000;
    }

    footer {
      text-align: center;
      color: #ccc;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 0;
      font-size: 0.9rem;
    }
    
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">{{EMPRESA}}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="/home">Inicial</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Cadastros
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/cliente/lista">Cliente</a></li>
              <li><a class="dropdown-item" href="/fornecedor/lista">Fornecedor</a></li>
              <li><a class="dropdown-item" href="/usuario/lista">Usuário</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="hero">
    <h1>Bem-vindo ao {{EMPRESA}}</h1>
    <p>Seu sistema comercial completo para gestão de clientes, fornecedores e usuários.</p>
    <!-- <a href="/home" class="btn btn-custom">Entrar no Sistema</a> -->
  </div>

  <!-- Rodapé -->
  <footer>
    © {{ANO_ATUAL}} {{EMPRESA}} — Todos os direitos reservados.
  </footer>
</body>
</html>
