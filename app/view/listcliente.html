{% extends "main.html" %}

{% block main %}

<div class="container">
    <form id="form">
        <input type="text" id="id" name="id">
        <div class="row">
            <div class="col-12">
                <div class="card-header">
                    <a href="/cliente/cadastro" class="btn btn-success">Cadastro</a>
                </div>
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nome ou Nome Fantasia</th>
                                <th>SobreNome ou Razão Social</th>
                                <th>CPF ou CNPJ</th>
                                <th>RG ou Inscrição Estadual</th>
                                <th>E-mail</th>
                                <th>Celular</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
{% block script %}
{% include "script.html"%}
<script src="/js/liscliente.js"></script>
{% endblock %}
