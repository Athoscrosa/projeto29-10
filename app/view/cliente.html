{% extends "main.html" %}

{% block main %}
<div class="container">
  <div class="row">
    <div class="col-12">
      <form class="row g-3 needs-validation" novalidate>

        <div class="col-md-4">
          <label for="nome_nomefantasia" class="form-label">Nome ou Nome Fantasia</label>
          <input type="text" class="form-control" id="nome_nomefantasia" name="nome"
                 placeholder="Digite seu Nome ou Nome Fantasia" required>
        </div>

        <div class="col-md-4">
          <label for="sobrenome_razaosocial" class="form-label">Sobrenome ou Razão Social</label>
          <input type="text" class="form-control" id="sobrenome_razaosocial" name="sobrenome"
                 placeholder="Digite seu Sobrenome ou Razão Social" required>
        </div>

        <div class="col-md-6">
          <label for="cpf_cnpj" class="form-label">CPF ou CNPJ</label>
          <input type="text" class="form-control" id="cpf_cnpj" name="cpf_cnpj"
                 placeholder="Digite seu CPF ou CNPJ" required>
        </div>

        <div class="col-md-6">
          <label for="rg" class="form-label">RG</label>
          <input type="text" class="form-control" id="rg" name="rg" placeholder="Digite seu RG" required>
        </div>

        <div class="col-md-6">
          <label for="inscricao_estadual" class="form-label">Inscrição Estadual (IE)</label>
          <input type="text" class="form-control" id="inscricao_estadual" name="inscricao_estadual"
                 placeholder="Digite sua Inscrição Estadual" required>
        </div>

        <div class="col-md-4">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu E-mail" required>
        </div>

        <div class="col-md-4">
          <label for="celular" class="form-label">Celular</label>
          <input type="text" class="form-control" id="celular" name="celular"
                 placeholder="Digite seu celular" required>
        </div>

        <div class="col-12">
          <button class="btn btn-success" type="button" id="salvar">Cadastrar</button>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
  {% include "script.html" %}
  <script src="/js/user.js"></script>
{% endblock %}
